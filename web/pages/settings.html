<template page>

  <div class="page">

  <div class="row">

  <div class="content">

  <!-- 语音播报模式：title + 状态。在线 edge-tts 优先，失败/无网络自动降级系统语音 -->
  <o-if :value="mode === 'voice'">
    <div class="row">
      <div class="label">

  <!-- 提醒音模式：每状态一个音效 + 开关 -->
  <o-if :value="mode === 'sound'">
    <o-fill
      :value="statusRows"
      fill-key="key"

  <script>
    export default async ({ load }) => {
      const {
        getSettings,
        getMasterVolume,
        setSetting,
        setMasterVolume,
        playSound,
      } = await load("../lib/sound.js");
      const {
        getVoiceSettings,
        setVoiceSetting,
        setVoiceEnabled,
        previewVoiceState,
        getZhSystemVoices,
        previewVoice,
        EDGE_VOICES,
        getAnnounceMode,
        setAnnounceMode,
      } = await load("../lib/sound.js");
      const { createIcons } = await load("../lib/icons.js");
      const { isSmallScreen, applyRotate, resetRotate } = await load("../lib/landscape.js");
      await load("../components/aw-select.html");

      const STATUS_DEFS = {
        awaiting_approval: { name: "等待审批", desc: "agent 请求工具权限时" },
        waiting_input: { name: "等待回复", desc: "agent 提问需要你回复时" },
        idle: { name: "AI 回复完成", desc: "agent 完成一轮回复时" },
        background_task: { name: "后台任务", desc: "agent 在跑后台任务时" },
        compacting: { name: "上下文压缩", desc: "agent 压缩上下文时" },
        error: { name: "出错", desc: "agent 回合出错时" },
        ended: { name: "会话结束", desc: "agent 会话结束时" },
        ws_disconnected: {
          name: "连接断开",
          desc: "与服务器的 WebSocket 断链时",
        },
        ws_connected: { name: "连接恢复", desc: "WebSocket 重新连接成功时" },
      };

      return {
        data: {
          masterVolume: 0.7,
          statusRows: [],
          voiceRows: [],
          mode: "sound",
          voiceRate: 1,
          systemVoices: [],
        },
        attached() {
          this.masterVolume = getMasterVolume();
          this.mode = getAnnounceMode();
          const v = getVoiceSettings();
          this.voiceRate = v.rate;
          // 语音下拉：在线语音同步填充；系统中文语音加载完成后补齐
          this.renderVoiceOptions();
          getZhSystemVoices((list) => {
            this.systemVoices = list;
            this.renderVoiceOptions();
          });
          this.refreshRows();
          this.refreshVoiceRows();
          this.renderIconsAfterPaint();
          try {
            createIcons();
            setTimeout(() => createIcons(), 300);
          } catch {}
          // 全屏横屏同步：从首页全屏横屏状态进入时保持旋转；全屏退出/转屏时清理
          this._landscapeSync = () => {
            // 用组件自身宿主而非 querySelector：路由切换瞬间文档可能同时有新旧 o-page
            const h = this.ele;
            if (!h) return;
            const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (inFs && isSmallScreen() && window.innerHeight > window.innerWidth) {
              h.setAttribute("data-force-landscape", "");
              applyRotate(h);
            } else if (h.hasAttribute("data-force-landscape")) {
              h.removeAttribute("data-force-landscape");
              resetRotate(h);
            }
          };
          document.addEventListener("fullscreenchange", this._landscapeSync);
          document.addEventListener("webkitfullscreenchange", this._landscapeSync);
          window.addEventListener("orientationchange", this._landscapeSync);
          this._landscapeSync();
        },
        detached() {
          if (this._landscapeSync) {
            document.removeEventListener("fullscreenchange", this._landscapeSync);
            document.removeEventListener("webkitfullscreenchange", this._landscapeSync);
            window.removeEventListener("orientationchange", this._landscapeSync);
          }
        },
        proto: {
          /** 渲染语音下拉（在线 + 系统语音，label 带来源后缀），保持当前选中。
           * o-if 按 mode 异步渲染，首次调用时组件可能未挂载 → 延迟重试 */
          renderVoiceOptions(tries = 0) {
            const sel = this.shadow.$("#voice-select")?.ele;
            if (!sel) {
              if (tries < 10)
                setTimeout(() => this.renderVoiceOptions(tries + 1), 50);
              return;
            }
            const edge = EDGE_VOICES.map(
              (x) => `${x.id}:${x.label}（在线）`,
            ).join(";");
            const local = this.systemVoices
              .map((x) => `${x.id}:${x.label}`)
              .join(";");
            sel.setAttribute(
              "options",
              [edge, local].filter(Boolean).join(";"),
            );
            sel.setAttribute("value", getVoiceSettings().voice || "");
          },
          /** 从 localStorage 重新读设置并刷新 statusRows（新数组引用，触发 o-fill 重渲染） */
          refreshRows() {
            const s = getSettings();
            this.statusRows = Object.keys(STATUS_DEFS).map((key) => ({
              key,
              ...STATUS_DEFS[key],
              ...s[key],
            }));
          },
          /** 刷新语音播报每状态开关行 */
          refreshVoiceRows() {
            const s = getVoiceSettings();
            this.voiceRows = Object.keys(STATUS_DEFS).map((key) => ({
              key,
              ...STATUS_DEFS[key],
              enabled: s.enabled[key] !== false,
            }));
          },
          toggle(key) {
            const row = this.statusRows.find((r) => r.key === key);
            if (!row) return;
            setSetting(key, { enabled: !row.enabled });
            this.refreshRows();
          },
          toggleVoice(key) {
            const row = this.voiceRows.find((r) => r.key === key);
            if (!row) return;
            setVoiceEnabled(key, !row.enabled);
            this.refreshVoiceRows();
          },
          previewVoice(key) {
            previewVoiceState(key);
          },
          onSoundChange(e, key) {
            // aw-select change：ofa emit 把数据挂 e.data（非 CustomEvent detail）
            const val = e?.data?.value;
            if (!val) return;
            setSetting(key, { sound: val });
            this.refreshRows();
            playSound(val, this.masterVolume);
          },
          preview(key) {
            const row = this.statusRows.find((r) => r.key === key);
            if (row) playSound(row.sound, this.masterVolume);
          },
          previewMaster() {
            playSound("ding", this.masterVolume);
          },
          onMasterVolume(e) {
            this.masterVolume = Number(e.target.value);
            setMasterVolume(this.masterVolume);
          },
          onVoiceChange(e) {
            const val = e?.data?.value;
            if (!val) return;
            setVoiceSetting({ voice: val });
          },
          previewVoiceBtn() {
            previewVoice();
          },
          onVoiceRate(e) {
            this.voiceRate = Number(e.target.value);
            setVoiceSetting({ rate: this.voiceRate });
          },
          setMode(mode) {
            this.mode = mode;
            setAnnounceMode(mode);
            // 刷新语音播报开关行（o-if 重建后数据绑定最新）
            this.refreshVoiceRows();
            // o-if 切换会重建设置区块 DOM（语音下拉 + data-lucide 图标占位），
            // 下拉由 renderVoiceOptions 填充；图标等渲染完成后补
            this.renderVoiceOptions();
            this.renderIconsAfterPaint();
          },
          /** o-if 渲染完成后替换 data-lucide 占位（双 rAF：渲染帧 + 稳定帧） */
          renderIconsAfterPaint() {
            requestAnimationFrame(() =>
              requestAnimationFrame(() => {
                try {
                  createIcons();
                } catch {}
              }),
            );
          },
        },
      };
    };
  </script>
</template>
