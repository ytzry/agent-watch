    .aw-btn:focus-visible {
      outline: none;

      background: hsl(var(--secondary));

    .aw-btn-secondary:hover { background: hsl(var(--secondary) / 0.8); }

    /* Switch（shadcn switch 组件，滑块垂直居中） */
    .aw-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 44px;
      height: 24px;
      border-radius: 9999px;
      border: 1px solid transparent;
      background: hsl(var(--input));
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      align-self: center;
      box-sizing: border-box;
      vertical-align: middle;
    }
    .aw-switch.on { background: hsl(var(--primary)); }
    .aw-switch::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: hsl(0 0% 100%);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      transition: transform 0.2s;
      transform: translateY(-50%);
    }
    .aw-switch.on::after { transform: translateY(-50%) translateX(20px); }

    /* Select（shadcn select 风格） */
    /* Select（shadcn select 风格：trigger 样式 + ChevronDown 图标，箭头用 wrap ::after 画） */
    .select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    /* ChevronDown 图标（shadcn: size-4 opacity-50 text-muted-foreground） */
    .select-wrap::after {
      content: '';
      position: absolute;

      height: 6px;
      border-right: 1.5px solid hsl(var(--muted-foreground));
      border-bottom: 1.5px solid hsl(var(--muted-foreground));
      opacity: 0.5;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;

    /* Trigger 视觉（shadcn: h-9 px-3 rounded-md border-input bg-transparent，隐藏原生箭头） */
    .aw-select {

      line-height: 36px;
      align-self: center;
      box-sizing: border-box;
      vertical-align: middle;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }
    .aw-select:focus-visible {
      outline: none;
      border-color: hsl(var(--ring));
      box-shadow: 0 0 0 3px hsl(var(--ring) / 0.5);
    }

    /* Slider */
    .aw-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 20px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;

    .aw-slider:focus { outline: none; }

      border-radius: 9999px;

    /* ===== 自定义滚动条（shadcn 风格） ===== */

      width: 6px;
      height: 6px;

    :host::-webkit-scrollbar-track {
      background: transparent;
    }
    :host::-webkit-scrollbar-thumb {
      background: hsl(var(--border));
      border-radius: 9999px;
    }
    :host::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--muted-foreground) / 0.5);
    }
    :host {
      scrollbar-width: thin;           /* Firefox */
      scrollbar-color: hsl(var(--border)) transparent;
    }
  </style>

  <div class="header">
    <h1>声音播报设置</h1>
    <a href="./home.html" olink>
      <i class="aw-ic" data-lucide="arrow-left"></i>返回
    </a>
  </div>

  <div class="row master">
    <i class="aw-ic" data-lucide="volume-2"></i>
    <div class="label">
      <div class="name">全局音量</div>
      <div class="desc">所有播报音量</div>
    </div>
    <input class="aw-slider" type="range" min="0" max="1" step="0.05" :value="masterVolume"
      on:input="onMasterVolume($event)" />
    <button class="aw-btn aw-btn-secondary" on:click="previewMaster">
      <i class="aw-ic" data-lucide="play"></i>试听
    </button>
  </div>

  <o-fill :value="statusRows" fill-key="key">
    <div class="row">
      <div class="label">
        <div class="name">{{$data.name}}</div>
        <div class="desc">{{$data.desc}}</div>
      </div>
      <div class="aw-switch" class:on="$data.enabled" on:click="$host.toggle($data.key)"></div>
      <div class="select-wrap">
        <select class="aw-select" on:change="$host.onSoundChange($event, $data.key)">
          <option value="beep" attr:selected="$data.sound === 'beep'">哔哔</option>
          <option value="ding" attr:selected="$data.sound === 'ding'">叮</option>
          <option value="chime" attr:selected="$data.sound === 'chime'">风铃</option>
          <option value="alert" attr:selected="$data.sound === 'alert'">提醒</option>
          <option value="success" attr:selected="$data.sound === 'success'">成功</option>
          <option value="error" attr:selected="$data.sound === 'error'">错误</option>
        </select>
      </div>
      <button class="aw-btn aw-btn-secondary" on:click="$host.preview($data.key)">
        <i class="aw-ic" data-lucide="play"></i>试听
      </button>
    </div>
  </o-fill>

  <script>
    export default async ({ load }) => {
      const { getSettings, getMasterVolume, setSetting, setMasterVolume, playSound } = await load('../lib/sound.js');
      const { createIcons } = await load('../lib/icons.js');

      const STATUS_DEFS = {
        awaiting_approval: { name: '等待审批', desc: 'agent 请求工具权限时' },
        waiting_input: { name: '等待回复', desc: 'agent 提问需要你回复时' },
        idle: { name: 'AI 回复完成', desc: 'agent 完成一轮回复时' },
        background_task: { name: '后台任务', desc: 'agent 在跑后台任务时' },
        compacting: { name: '上下文压缩', desc: 'agent 压缩上下文时' },
        error: { name: '出错', desc: 'agent 回合出错时' },
        ended: { name: '会话结束', desc: 'agent 会话结束时' },
        ws_disconnected: { name: '连接断开', desc: '与服务器的 WebSocket 断链时' },
        ws_connected: { name: '连接恢复', desc: 'WebSocket 重新连接成功时' },
      };

      return {
        data: {
          masterVolume: 0.7,
          statusRows: [],
        },
        attached() {
          this.masterVolume = getMasterVolume();
          this.refreshRows();
          try {
            createIcons();
            setTimeout(() => createIcons(), 300);
          } catch {}
        },
        proto: {
          /** 从 localStorage 重新读设置并刷新 statusRows（新数组引用，触发 o-fill 重渲染） */
          refreshRows() {
            const s = getSettings();
            this.statusRows = Object.keys(STATUS_DEFS).map((key) => ({
              key,
              ...STATUS_DEFS[key],
              ...s[key],
            }));
          },
          toggle(key) {
            const row = this.statusRows.find((r) => r.key === key);
            if (!row) return;
            setSetting(key, { enabled: !row.enabled });
            this.refreshRows();
          },
          onSoundChange(e, key) {
            const val = e && e.target ? e.target.value : null;
            if (!val) return;
            setSetting(key, { sound: val });
            this.refreshRows();
            playSound(val, this.masterVolume);
          },
          preview(key) {
            const row = this.statusRows.find((r) => r.key === key);
            if (row) playSound(row.sound, this.masterVolume);
          },
          previewMaster() {
            playSound('ding', this.masterVolume);
          },
          onMasterVolume(e) {
            this.masterVolume = Number(e.target.value);
            setMasterVolume(this.masterVolume);
          },
        },
      };
    };
  </script>
</template>
