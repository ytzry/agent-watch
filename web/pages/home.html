<template page>

    /* ===== 自适应多列：窄屏自动 1 列，宽屏自动多列（物理横屏/桌面由媒体查询驱动） ===== */
    @media (min-width: 700px) {

    @media (min-width: 1360px) {

    /* ===== 强制横屏（CSS 旋转模拟）：媒体查询按物理视口判断，旋转后宽度=视口高，
             用 JS 注入 --landscape-cols 列数（按旋转后宽度算），绕开容器查询兼容问题 ===== */
    :host([data-force-landscape]) .cards {
      display: grid;
      grid-template-columns: repeat(var(--landscape-cols, 2), minmax(0, 1fr));
      gap: 12px;

    }
    :host([data-force-landscape]) .cards > * { min-width: 0; }
    :host([data-force-landscape]) task-card {

    /* ===== 横屏适配 ===== */
    /* 1) 真横屏（手机横放）：卡片更紧凑，充分利用宽度（列表保持单列） */
    @media (orientation: landscape) {
      .header { padding: 0.4rem 0; margin-bottom: 0.6rem; }
      .counts { gap: 14px; }
      .group { margin-bottom: 0.8rem; }
    }
    /* 2) 强制横屏（竖持手机点按钮）：宿主固定 + 旋转 90°，位置由 JS 精确设置（居中无截断）。
       注意：rotate 与 transform-origin 由 JS 内联写入（_applyRotate），不依赖伪类——
       全屏态下浏览器可能对 :host 伪类规则匹配不稳定，内联样式保证真机旋转一定生效 */
    :host([data-force-landscape]) {
      position: fixed;
      margin: 0;
      display: block;
      overflow: hidden;
    }
    :host([data-force-landscape]) .page {
      /* 尺寸由 JS 内联设置（宽=视口高，高=视口宽），这里只保证弹性布局 */
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    /* 强制横屏时保持单列布局（不依赖 orientation media query，因为物理还是竖屏） */
    :host([data-force-landscape]) .header {
      padding: 0.4rem 0;
      margin-bottom: 0.6rem;
      position: relative;   /* 横屏时不 sticky（宿主已 fixed），保证可见 */
      flex-shrink: 0;
      flex-wrap: nowrap;    /* 横屏宽够，不换行 */
    }
    :host([data-force-landscape]) .counts {
      gap: 10px;
    }
    :host([data-force-landscape]) .counts .count-item .aw-ic {
      width: 18px;
      height: 18px;
    }
    :host([data-force-landscape]) .counts .count-item .num {
      font-size: 0.95rem;
    }
    :host([data-force-landscape]) .group {
      margin-bottom: 0.8rem;
    }
    /* ===== 自定义滚动条（shadcn 风格：细、圆角、hover 变亮） ===== */
    .list-area::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .list-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .list-area::-webkit-scrollbar-thumb {
      background: hsl(var(--border));
      border-radius: 9999px;
    }
    .list-area::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--muted-foreground) / 0.5);
    }
    .list-area {
      scrollbar-width: thin;           /* Firefox */
      scrollbar-color: hsl(var(--border)) transparent;
    }
  </style>

  <div class="page">
    <div class="header">
      <div class="counts">
        <span class="count-item wait"><i class="aw-ic" data-lucide="bell"></i><span class="num">{{waitCount}}</span></span>
        <span class="count-item"><i class="aw-ic" data-lucide="loader-circle"></i><span class="num">{{runningCount}}</span></span>
        <span class="count-item"><i class="aw-ic" data-lucide="check"></i><span class="num">{{idleCount}}</span></span>
      </div>
      <div class="header-right">
        <div class="status-dot" class:on="connected"></div>
        <a class="rotate-link" href="javascript:void(0)" aria-label="切换全屏">
          <i class="aw-ic" attr:data-lucide="fsIcon"></i>
        </a>
        <a class="settings-link" href="./settings.html" olink aria-label="设置">
          <i class="aw-ic" data-lucide="settings"></i>
        </a>
      </div>
    </div>

    <div class="list-area">
      <o-if :value="!groups.length">
        <div class="empty">
          <div>暂无任务</div>
          <div class="sub">等待 agent 会话事件接入…</div>
        </div>
      </o-if>

      <o-fill :value="groups" fill-key="project">
        <div class="group">
          <div class="group-title">
            <span class="bar"></span>
            <span>{{$data.project}}</span>
            <span class="count">{{$data.sessions.length}}</span>
          </div>
          <div class="cards">
            <o-fill :value="$data.sessions" fill-key="id">
              <task-card :session="$data"></task-card>
            </o-fill>
          </div>
        </div>
      </o-fill>
    </div>
  </div>

  <script>
    export default async ({ load }) => {
      await load('../components/task-card.html');
      const { connect, getSnapshot, subscribe } = await load('../lib/ws-client.js');
      const { notifyState } = await load('../lib/sound.js');
      const { createIcons } = await load('../lib/icons.js');
      return {
        data: {
          groups: [],
          counts: {},
          waitCount: 0,
          runningCount: 0,
          idleCount: 0,
          connected: false,
          fsIcon: 'maximize',
        },
        attached() {
          // 全局点击委托：document 级监听（shadow 内点击会冒泡到 document，用坐标判断目标）
          this._landscapeHandler = (e) => {
            const host = document.querySelector('o-page');
            if (!host || !host.shadowRoot) return;
            const link = host.shadowRoot.querySelector('.rotate-link');
            if (!link) return;
            const rect = link.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top && e.clientY <= rect.bottom) {
              e.preventDefault();
              this.toggleLandscape();
            }
          };
          document.addEventListener('click', this._landscapeHandler);
          // 全屏状态同步：进入/退出全屏（含用户按 ESC）时校准横屏旋转与布局尺寸
          this._fsChangeHandler = () => {
            const h = document.querySelector('o-page');
            if (!h) return;
            const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (inFs) {
              // 进入全屏：仅小屏竖屏设备自动补旋转横屏；大屏/物理横屏直接用原生布局
              if (this._isSmallScreen() && window.innerHeight > window.innerWidth) {
                h.setAttribute('data-force-landscape', '');
                this.fsIcon = 'minimize';
                this._applyRotate(h);
              }
            } else if (h.hasAttribute('data-force-landscape')) {
              // 退出全屏（ESC / API）：同步清理强制横屏
              h.removeAttribute('data-force-landscape');
              this._resetRotate(h);
              document.body.style.overflow = '';
              this.fsIcon = 'maximize';
            }
            // 全屏尺寸变化后重算宿主高度（非旋转态）
            if (this._fixHeight) this._fixHeight();
            try { createIcons(); } catch {}
          };
          document.addEventListener('fullscreenchange', this._fsChangeHandler);
          document.addEventListener('webkitfullscreenchange', this._fsChangeHandler);
          // 物理转屏（手机横放/竖放）：旋转态下若变为物理横屏，清理残留旋转避免方向错乱；
          // 物理竖屏时若正处于全屏，自动补齐旋转
          this._orientationHandler = () => {
            const h = document.querySelector('o-page');
            if (!h) return;
            if (h.hasAttribute('data-force-landscape') && window.innerWidth > window.innerHeight) {
              h.removeAttribute('data-force-landscape');
              this._resetRotate(h);
              this.fsIcon = 'maximize';
            } else if (this._isSmallScreen() &&
                       (document.fullscreenElement || document.webkitFullscreenElement) &&
                       window.innerHeight > window.innerWidth) {
              h.setAttribute('data-force-landscape', '');
              this.fsIcon = 'minimize';
              this._applyRotate(h);
            }
            if (this._fixHeight) this._fixHeight();
            try { createIcons(); } catch {}
          };
          if (screen.orientation?.addEventListener) {
            screen.orientation.addEventListener('change', this._orientationHandler);
          } else {
            window.addEventListener('orientationchange', this._orientationHandler);
          }
          // 锁定宿主高度 = 视口高（保证 header 固定 + 列表区滚动，不随内容撑开）
          // 旋转态下由 CSS :host([data-force-landscape]) 管理 fixed + 旋转，这里重算旋转尺寸
          const fixHeight = () => {
            const h = document.querySelector('o-page');
            if (!h) return;
            if (h.hasAttribute('data-force-landscape')) {
              this._applyRotate(h);
              return;
            }
            h.style.height = window.innerHeight + 'px';
            h.style.position = '';
            h.style.width = '';
          };
          fixHeight();
          setTimeout(fixHeight, 200);
          window.addEventListener('resize', fixHeight);
          this._fixHeight = fixHeight;
          this.unsub = subscribe((msg) => {
            if (msg.type === 'snapshot') {
              this.applySnapshot(msg.data);
            } else if (msg.type === 'state_change') {
              // 声音播报：进入某状态时按设置播放
              notifyState(msg.session.state);
              this.applySnapshot(getSnapshot());
            } else if (msg.type === 'updated' || msg.type === 'session_update') {
              this.applySnapshot(getSnapshot());
            } else if (msg.type === 'connected') {
              // 声音播报：连接成功（首次连接 / 断线后恢复 / 返回页面时补发）
              if (!this._wasConnected) notifyState('ws_connected');
              this.connected = true;
              this._wasConnected = true;
            } else if (msg.type === 'disconnected') {
              // 声音播报：断链（重连失败循环中不重复播）
              if (this._wasConnected) notifyState('ws_disconnected');
              this.connected = false;
              this._wasConnected = false;
            }
          });
          // 先订阅再连接：connect() 内的同步补发（已连接时返回）才能被本页收到，
          // 避免「从设置页返回后指示灯停在初始红色」——补发的 connected 事件会把状态修正
          connect();
          this.applySnapshot(getSnapshot());
        },
        detached() {
          if (this.unsub) this.unsub();
          if (this._fixHeight) window.removeEventListener('resize', this._fixHeight);
          if (this._landscapeHandler) document.removeEventListener('click', this._landscapeHandler);
          if (this._fsChangeHandler) {
            document.removeEventListener('fullscreenchange', this._fsChangeHandler);
            document.removeEventListener('webkitfullscreenchange', this._fsChangeHandler);
          }
          if (this._orientationHandler) {
            if (screen.orientation?.removeEventListener) {
              screen.orientation.removeEventListener('change', this._orientationHandler);
            } else {
              window.removeEventListener('orientationchange', this._orientationHandler);
            }
          }
        },
        ready() {
          // 深度扫描（含 shadow DOM）替换 data-lucide 占位；延时兜底确保渲染完成
          try {
            createIcons();
            setTimeout(() => createIcons(), 300);
            setTimeout(() => createIcons(), 1000);
          } catch {}
        },
        proto: {
          /** 小屏判定：手机尺寸（任一边 < 600px）。大屏竖屏（平板/桌面窄窗）全屏不自动旋转 */
          _isSmallScreen() {
            return Math.min(window.innerWidth, window.innerHeight) < 600;
          },
          applySnapshot(snap) {
            if (!snap) return;
            this.groups = snap.groups || [];
            this.counts = snap.counts || {};
            // 注意：connected 由 ws-client 的 connected/disconnected 事件维护，快照无此字段，不要覆盖
            // 预计算计数（避免模板复杂表达式求值问题）
            const c = this.counts;
            this.waitCount = (c.awaiting_approval || 0) + (c.waiting_input || 0);
            this.runningCount = c.running || 0;
            this.idleCount = c.idle || 0;
          },
          /** 竖屏旋转尺寸定位：宿主宽=视口高、高=视口宽，rotate(90deg) 后视觉居中。
           *  transform 内联写入而非依赖 CSS 伪类，保证全屏态下旋转一定生效 */
          _applyRotate(host) {
            const vw = window.innerWidth, vh = window.innerHeight;
            host.style.width = vh + 'px';
            host.style.height = vw + 'px';
            host.style.left = vw + 'px';
            host.style.top = '0px';
            host.style.transform = 'rotate(90deg)';
            host.style.transformOrigin = 'top left';
            const page = host.shadowRoot?.querySelector('.page');
            if (page) {
              page.style.width = vh + 'px';
              page.style.height = vw + 'px';
            }
            // 旋转后实际宽度 = 视口高，据此决定多列数（绕开容器查询兼容问题）
            host.style.setProperty('--landscape-cols', vh >= 1100 ? 3 : 2);
          },
          /** 清除旋转定位，恢复竖屏布局 */
          _resetRotate(host) {
            host.style.left = '';
            host.style.top = '';
            host.style.width = '';
            host.style.transform = '';
            host.style.transformOrigin = '';
            host.style.height = window.innerHeight + 'px';
            host.style.removeProperty('--landscape-cols');
            const page = host.shadowRoot?.querySelector('.page');
            if (page) { page.style.width = ''; page.style.height = ''; }
          },
          /** 强制横屏切换：业内标准做法是 全屏 API + screen.orientation.lock('landscape')，
           *  移动端竖屏物理锁横屏（系统 UI 跟着转，内容无需 transform）；
           *  方向锁不可用（桌面/旧 iOS/被拒）时降级为 transform 旋转 90° 模拟横屏。
           *  物理横屏（桌面/手机横放）点击只进全屏，不旋转——本身就是横屏。 */
          toggleLandscape() {
            const host = document.querySelector('o-page');
            if (!host) return;
            // 已在旋转态：清理旋转；若同时在全屏则一并退出（fullscreenchange 会兜底清理）
            if (host.hasAttribute('data-force-landscape')) {
              host.removeAttribute('data-force-landscape');
              this._resetRotate(host);
              this.fsIcon = 'maximize';
              document.body.style.overflow = '';
              this._exitFullscreen();
              if (this._fixHeight) this._fixHeight();
              try { createIcons(); } catch {}
              return;
            }
            // 物理横屏：点击只进全屏（已横屏无需旋转），保持原生布局
            if (window.innerWidth > window.innerHeight) {
              const enterPlain = async () => {
                try {
                  if (host.requestFullscreen) await host.requestFullscreen();
                  else if (host.webkitRequestFullscreen) await host.webkitRequestFullscreen();
                } catch {}
              };
              enterPlain();
              return;
            }
            // 物理竖屏：先全屏，再尝试原生方向锁（移动端首选，桌面/不支持时 reject）；
            // 方向锁成功物理已横屏，无需 transform；失败降级为 transform 旋转模拟横屏
            const enterFs = async () => {
              try {
                if (host.requestFullscreen) {
                  await host.requestFullscreen();
                } else if (host.webkitRequestFullscreen) {
                  await host.webkitRequestFullscreen();
                } else {
                  throw new Error('no fullscreen api');
                }
                if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
                  throw new Error('fullscreen not entered');
                }
                // 已进入全屏：尝试原生方向锁（移动端首选，桌面/不支持时 reject）
                let locked = false;
                try {
                  if (screen.orientation?.lock) {
                    await screen.orientation.lock('landscape');
                    locked = true;
                  }
                } catch { locked = false; }
                if (locked) {
                  // 物理已锁横屏：原生横屏布局，无需 transform
                  this.fsIcon = 'minimize';
                  if (this._fixHeight) this._fixHeight();
                } else {
                  // 方向锁不可用：transform 旋转模拟横屏
                  host.setAttribute('data-force-landscape', '');
                  this.fsIcon = 'minimize';
                  this._applyRotate(host);
                }
              } catch {
                this._enterRotateOnly(host);
              }
            };
            enterFs();
          },
          _enterRotateOnly(host) {
            host.setAttribute('data-force-landscape', '');
            document.body.style.overflow = 'hidden';
            this.fsIcon = 'minimize';
            this._applyRotate(host);
            try { createIcons(); setTimeout(() => createIcons(), 200); } catch {}
          },
          _exitFullscreen() {
            try {
              // 解锁方向锁（若已通过 orientation.lock 锁横屏），恢复系统默认方向
              if (screen.orientation?.unlock) screen.orientation.unlock();
              if (document.exitFullscreen) document.exitFullscreen();
              else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } catch {}
          },
        },
      };
    };
  </script>
</template>
