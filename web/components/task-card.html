<template component>
  <style>

    .usage {
      margin-top: 9px;

    }
    .usage-bar {
      height: 100%;

    .usage-text {
      font-size: 0.7rem;

    }
    .usage-text .aw-ic {
      width: 12px;
      height: 12px;
      color: hsl(var(--brand));
    }
    .time {
      font-size: 0.7rem;
      color: hsl(var(--muted-foreground) / 0.7);
      margin-top: auto;
      padding-top: 7px;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .time .aw-ic {
      width: 12px;
      height: 12px;
    }
    .hidden {
      display: none !important;
    }
    /* ===== 紧凑模式（多列网格时由父级注入 CSS 变量启用）：压缩动态高度，让卡片更整齐 ===== */
    /* 消息行数：默认 2 行，多列时 1 行 */
    .msg {
      -webkit-line-clamp: var(--msg-clamp, 2);
    }
    /* todo 条数：默认全部展示，多列时最多约 2 条 */
    .todos {
      max-height: var(--todos-max, none);
      overflow: hidden;
    }
    /* ===== 状态徽章（统一中性底色，状态用文字色区分；不改变卡片背景观感） ===== */
    .aw-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 9999px;
      border: 1px solid hsl(var(--border));
      padding: 0.18rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      background: hsl(var(--secondary));
    }
    /* 状态语义色（仅文字 + 前置小圆点，背景统一） */
    .aw-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;

    .aw-badge.state-running { color: hsl(var(--info)); }
    .aw-badge.state-awaiting_approval { color: hsl(var(--warning)); }
    .aw-badge.state-waiting_input { color: hsl(35 92% 65%); }
    .aw-badge.state-idle { color: hsl(var(--success)); }
    .aw-badge.state-background_task { color: hsl(var(--muted-foreground)); }
    .aw-badge.state-compacting { color: hsl(var(--muted-foreground)); }
    .aw-badge.state-error { color: hsl(0 84% 70%); }
    .aw-badge.state-ended { color: hsl(var(--muted-foreground)); }
  </style>

  <div class="card">
    <!-- 半透明品牌 logo 背景水印（右侧） -->
    <div class="bg-logo">
      <img attr:src="logoUrl" alt="" />
    </div>
    <div class="main">
      <div class="top">
        <span class="title">{{title}}</span>
        <span attr:class="badgeClass">{{stateLabel}}</span>
        <span class="mode" class:hidden="!modeLabel">{{modeLabel}}</span>
      </div>
      <div class="meta">
        <span>{{providerLabel}}</span>
        <span class:hidden="!lastTool"><i class="aw-ic" data-lucide="wrench"></i>{{lastTool}}</span>
        <span class:hidden="!subagentCount"><i class="aw-ic" data-lucide="git-branch"></i>×{{subagentCount}}</span>
      </div>
      <div class="msg" class:hidden="!lastMessage">{{lastMessage}}</div>
      <div class="todos" class:hidden="!todo.length">
        <o-fill :value="todo">
          <div class="todo" class:done="$data.status === 'completed' || $data.status === 'done'">
            <span class="dot"><i class="aw-ic" data-lucide="check"></i></span>
            <span class="text">{{$data.content || $data.description}}</span>
          </div>
        </o-fill>
      </div>
      <div class="usage" class:hidden="!hasUsage">
        <div class="usage-bar" :style.width="(usage && usage.pct != null ? usage.pct : 0) + '%'"></div>
      </div>
      <div class="usage-text" class:hidden="!hasUsage">
        <i class="aw-ic" data-lucide="gauge"></i>{{usageText}}<span class:hidden="!cacheHitText"> · 缓存 {{cacheHitText}}</span>
      </div>
      <div class="time">
        <i class="aw-ic" data-lucide="clock"></i>{{timeLabel}}
      </div>
    </div>
  </div>

  <script>
    export default async () => {
      const PROVIDER_LABELS = {
        'claude-code': 'Claude Code',
        codex: 'Codex',
        zcode: 'ZCode',
      };
      const STATE_LABELS = {
        created: '新建',
        running: '执行中',
        awaiting_approval: '等待审批',
        waiting_input: '等待回复',
        idle: '已完成',
        background_task: '后台任务',
        compacting: '压缩中',
        error: '错误',
        ended: '已结束',
      };
      const MODE_LABELS = {
        ask: '询问',
        auto: '自动',
        plan: '计划',
        acceptEdits: '接受编辑',
        bypass: '完全访问',
      };
      return {
        tag: 'task-card',
        attrs: { session: '{}' },
        data: {
          title: '',
          badgeClass: 'aw-badge',
          state: '',
          stateLabel: '',
          modeLabel: '',
          providerLabel: '',
          logoUrl: '',
          lastTool: '',
          lastMessage: '',
          todo: [],
          usage: null,
          hasUsage: false,
          usageText: '',
          cacheHitText: '',
          subagentCount: 0,
          timeLabel: '',
        },
        ready() {
          this.applySession();
        },
        watch: {
          session() {
            this.applySession();
          },
        },
        proto: {
          formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
            return d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          },
          // token 容量格式化（行业惯例，同 ccusage）：<1M 用 k（千），≥1M 用 M（百万）
          // 例：200000 → 200k，128000 → 128k，1000000 → 1M，240771 → 241k
          fmtTokens(n) {
            if (!n || !isFinite(n) || n <= 0) return '';
            if (n >= 1e6) {
              const m = n / 1e6;
              return (m >= 10 ? Math.round(m) : m.toFixed(1).replace(/\.0$/, '')) + 'M';
            }
            return Math.round(n / 1e3) + 'k';
          },
          applySession() {
            // session 作为属性传入是 JSON 字符串（HTML attribute），解析为对象
            let s = this.session;
            if (typeof s === 'string') {
              try { s = JSON.parse(s); } catch { s = {}; }
            }
            s = s || {};
            this.title = s.title || s.cwd || '（无标题）';
            this.badgeClass = 'aw-badge state-' + (s.state || '');
            this.state = s.state || '';
            this.stateLabel = STATE_LABELS[s.state] || s.state || '';
            this.modeLabel = MODE_LABELS[s.mode] || (s.mode ? String(s.mode) : '');
            this.providerLabel = PROVIDER_LABELS[s.provider] || s.provider || '';
            // 统一用 SVG logo（内容占满画布，可染色：claude/codex 单色品牌 logo，zcode 品牌色方块+白Z）
            this.logoUrl = '/assets/logos/' + (s.provider || 'zcode') + '.svg';
            this.lastTool = s.lastTool || '';
            this.lastMessage = s.lastMessage || '';
            this.todo = s.todo || [];
            this.usage = s.usage || {};
            this.hasUsage = !!(s.usage && s.usage.pct != null);
            // 上下文容量：当前用量 / 总容量 (百分比)，如 174k / 1M (17%)
            if (this.hasUsage) {
              const ctx = s.usage.contextTokens || s.usage.totalTokens || 0;
              const max = s.usage.maxTokens || 0;
              this.usageText = `${this.fmtTokens(ctx)} / ${this.fmtTokens(max)} (${s.usage.pct}%)`;
              // 缓存命中率：0-1 → 百分比。不四舍五入，保留两位小数展示，
              // 精确反映真实比值（99.96% 就显示 99.96%，不虚报成 100%）
              const hit = s.usage.cacheHitRate;
              this.cacheHitText = hit != null && isFinite(hit) ? (hit * 100).toFixed(2) + '%' : '';
            } else {
              this.usageText = '';
              this.cacheHitText = '';
            }
            this.subagentCount = (s.subagents || []).length;
            this.timeLabel = this.formatTime(s.updatedAt);
            // 平台品牌色 → 宿主属性（CSS 变量）
            if (this.ele) this.ele.setAttribute('data-provider', s.provider || 'zcode');
          },
        },
      };
    };
  </script>
</template>
